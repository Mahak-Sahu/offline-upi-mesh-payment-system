server.port=8080

# Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/offline_upi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Mesh
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400

# Thymeleaf
spring.thymeleaf.cache=false

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Static resources
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false